<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100">
  <!-- Untere Eierschale -->
  <path d="M15 62 C15 82, 24 95, 40 95 C56 95, 65 82, 65 62 Z" fill="#ede0c4"/>
  <!-- Flecken untere Schale -->
  <ellipse cx="28" cy="78" rx="3" ry="2" fill="#5c3a1e" opacity="0.6" transform="rotate(15 28 78)"/>
  <ellipse cx="50" cy="74" rx="2.5" ry="2" fill="#4a2e12" opacity="0.55" transform="rotate(-10 50 74)"/>
  <ellipse cx="38" cy="87" rx="2" ry="1.5" fill="#5c3a1e" opacity="0.5"/>
  <!-- Obere Eierschale (aufgebrochen, leicht verkippt) -->
  <path d="M12 58 C12 38, 22 8, 40 8 C58 8, 68 38, 68 58
            L58 58
            C58 45, 52 30, 40 30 C28 30, 22 45, 22 58 Z"
        fill="#ede0c4" transform="rotate(-18 40 58) translate(-2 -6)"/>
  <!-- Flecken obere Schale -->
  <ellipse cx="32" cy="30" rx="3" ry="2" fill="#5c3a1e" opacity="0.6" transform="rotate(-20 32 30) rotate(-18 40 58) translate(-2 -6)"/>
  <ellipse cx="50" cy="38" rx="2.5" ry="2" fill="#4a2e12" opacity="0.55" transform="rotate(10 50 38) rotate(-18 40 58) translate(-2 -6)"/>
  <!-- Bruchlinie (Zickzack) -->
  <polyline points="16,60 24,54 32,62 42,50 52,60 62,53 68,58"
            fill="none" stroke="#8b6030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Kleines Küken-Köpfchen das rausschaut -->
  <circle cx="40" cy="52" r="11" fill="#f5d06a"/>
  <!-- Schnabel -->
  <polygon points="40,55 44,57 40,59" fill="#e8960a"/>
  <!-- Augen -->
  <circle cx="36" cy="50" r="2" fill="#2a1a08"/>
  <circle cx="44" cy="50" r="2" fill="#2a1a08"/>
  <!-- Glanzpunkt Auge -->
  <circle cx="36.8" cy="49.3" r="0.6" fill="white"/>
  <circle cx="44.8" cy="49.3" r="0.6" fill="white"/>
  <!-- Winzige Federn / Fussel oben -->
  <line x1="37" y1="41" x2="35" y2="37" stroke="#f5d06a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="40" y2="36" stroke="#f5d06a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="41" x2="45" y2="37" stroke="#f5d06a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
